<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atur Ulang Kata Sandi — SIM-SPPG</title>
  <meta name="theme-color" content="#1e6f9c">
  <style>
    :root{--primary:#1e6f9c;--primary-dark:#15577a;--slate-500:#475569;--slate-700:#334155;--slate-900:#0f172a;--slate-200:#e2e8f0;--rose:#e11d48;--emerald:#059669}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f0f4f8;color:var(--slate-700);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid var(--slate-200);border-radius:18px;padding:30px;box-shadow:0 18px 45px rgba(15,23,42,.10)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:48px;height:48px;border-radius:12px;object-fit:contain;border:1px solid var(--slate-200)}.brand strong{font-size:18px;color:var(--slate-900)}
    h1{margin:0 0 8px;color:var(--slate-900);font-size:25px}.intro{margin:0 0 22px;color:var(--slate-500);line-height:1.55;font-size:14px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}.field{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:10px;padding:0 13px;font-size:15px;outline:none}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,111,156,.12)}
    button{width:100%;height:46px;margin-top:20px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:hover{background:var(--primary-dark)}button:disabled{opacity:.65;cursor:not-allowed}
    .msg{display:none;margin:14px 0 0;padding:11px 12px;border-radius:9px;font-size:13px;line-height:1.45}.msg.show{display:block}.msg.error{background:#fff1f2;color:var(--rose)}.msg.success{background:#ecfdf5;color:var(--emerald)}
    .hint{font-size:12px;color:var(--slate-500);margin-top:14px;line-height:1.5}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="https://dmjsgtichrfxhyywstrt.supabase.co/storage/v1/object/public/app-assets/logo.png" alt="SIM-SPPG"><strong>SIM-SPPG</strong></div>
    <h1>Atur Ulang Kata Sandi</h1>
    <p class="intro">Masukkan kata sandi baru untuk akun Anda. Gunakan minimal 8 karakter.</p>
    <form id="resetForm" autocomplete="off">
      <label for="password">Kata Sandi Baru</label>
      <input id="password" class="field" type="password" minlength="8" autocomplete="new-password" required>
      <label for="passwordConfirm">Konfirmasi Kata Sandi</label>
      <input id="passwordConfirm" class="field" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submitBtn" type="submit">Simpan Kata Sandi Baru</button>
    </form>
    <div id="message" class="msg" role="alert"></div>
    <p id="hint" class="hint">Tautan pemulihan hanya dapat digunakan sesuai masa berlaku token. Jangan bagikan tautan ini kepada orang lain.</p>
  </main>
  <script>
  (function(){
    'use strict';
    var SUPABASE_URL='https://dmjsgtichrfxhyywstrt.supabase.co';
    var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtanNndGljaHJmeXdzdHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTU2MTUsImV4cCI6MjA5ODM5MTYxNX0.D_ZJ286uSpLeZEsg_vSf3iEoG-SnokHV62X6hPXreHM';
    var form=document.getElementById('resetForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('message'),hint=document.getElementById('hint');
    function show(text,type){msg.textContent=text;msg.className='msg show '+type}
    function params(){return new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/,'')||'')}
    var p=params();
    var accessToken=p.get('access_token')||'';
    var refreshToken=p.get('refresh_token')||'';
    var type=p.get('type')||'';
    var errorCode=p.get('error_code')||'';
    var errorDescription=p.get('error_description')||'';
    if(errorCode||errorDescription){show(errorDescription||'Tautan pemulihan tidak valid atau sudah kedaluwarsa.','error');form.classList.add('hidden');hint.textContent='Silakan kembali ke halaman login dan minta tautan reset kata sandi baru.';return}
    if(type!=='recovery'||!accessToken){show('Tautan reset kata sandi tidak valid atau sudah kedaluwarsa.','error');form.classList.add('hidden');hint.textContent='Silakan kembali ke halaman login dan minta tautan reset kata sandi baru.';return}
    // Remove credentials from browser history after capturing them in memory.
    try{history.replaceState({},document.title,location.pathname+location.search)}catch(e){}
    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      var password=document.getElementById('password').value;
      var confirm=document.getElementById('passwordConfirm').value;
      if(password.length<8){show('Kata sandi minimal 8 karakter.','error');return}
      if(password!==confirm){show('Konfirmasi kata sandi tidak sama.','error');return}
      btn.disabled=true;btn.textContent='Menyimpan...';msg.className='msg';
      fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+accessToken},body:JSON.stringify({password:password})})
      .then(function(res){return res.text().then(function(text){var data={};try{data=text?JSON.parse(text):{}}catch(e){}if(!res.ok)throw new Error(data.msg||data.message||data.error_description||'Kata sandi gagal diperbarui.');return data})})
      .then(function(){
        show('Kata sandi berhasil diperbarui. Silakan masuk kembali dengan kata sandi baru.','success');
        form.reset();form.classList.add('hidden');hint.textContent='Anda dapat menutup halaman ini lalu kembali ke SIM-SPPG.';
        try{sessionStorage.removeItem('sppg_jwt');localStorage.removeItem('sppg_jwt')}catch(e){}
      })
      .catch(function(err){show(err.message||'Terjadi kesalahan saat memperbarui kata sandi.','error');btn.disabled=false;btn.textContent='Simpan Kata Sandi Baru'})
    });
  })();
  </script>
</body>
</html>
