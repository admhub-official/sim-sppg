name: Apply inline supplier form

on:
  push:
    branches: [main]
    paths:
      - supplier-inline-create.js
      - scripts/apply-inline-supplier-form.mjs
      - supabase/migrations/20260730030501_enforce_transaction_category_and_supplier_rules.sql
      - .github/workflows/apply-inline-supplier-form.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-inline-supplier-form-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply idempotent patch
        run: node scripts/apply-inline-supplier-form.mjs

      - name: Validate patched JavaScript
        run: |
          node --check supplier-inline-create.js
          node --check _worker.js
          git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js supabase/functions/master-action/supplier.ts
          git commit -m 'feat: activate inline supplier creation'
          git push origin main
