name: Cleanup index overlap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-index-overlap.py'
      - '.github/workflows/cleanup-index-overlap.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-index-overlap
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply controlled cleanup
        run: python scripts/cleanup-index-overlap.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          ! grep -Fq 'id="page-laporan"' index.html
          ! grep -Fq '#btnRegister' index.html
          ! grep -Fq '#btnVerifyOtp' index.html
          ! grep -Fq 'data-auth-mode="register"' index.html
          ! grep -Fq '.report-unified-hero' index.html
          grep -Fq '@keyframes overlayFadeIn' index.html
          grep -Fq '<script src="./app.js?' index.html
          git diff --check
      - name: Commit cleaned index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Index cleanup already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean dead and overlapping frontend styles'
          git pull --rebase origin main
          git push origin main

