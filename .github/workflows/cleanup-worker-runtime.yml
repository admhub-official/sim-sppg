name: Cleanup worker runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-worker-runtime.py'
      - '.github/workflows/cleanup-worker-runtime.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-worker-runtime
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime cleanup
        run: python scripts/cleanup-worker-runtime.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check _worker.js
          grep -Fq 'var currentTrxId = null;' app.js
          ! grep -Fq "if (url.pathname.endsWith('/app.js'))" _worker.js
          ! grep -Fq 'professional-report-v1.js?v=' _worker.js
          ! grep -Fq 'supplier-inline-create.js?v=' _worker.js
          test ! -e supplier-inline-create.js
          git diff --check
      - name: Commit runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app.js _worker.js supplier-inline-create.js
          if git diff --cached --quiet; then
            echo 'Worker cleanup already current.'
            exit 0
          fi
          git commit -m 'Remove stale edge runtime source rewrites'
          git pull --rebase origin main
          git push origin main
