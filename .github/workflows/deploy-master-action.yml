# Manual recovery workflow. Automatic production deployment is handled only by
# .github/workflows/supabase-auto-deploy.yml to avoid concurrent Supabase deploys.
name: Deploy master-action (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dmjsgtichrfxhyywstrt
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate source
        run: |
          set -euo pipefail
          test -s supabase/functions/master-action/index.ts
          grep -q "ADMIN_ASSIGNMENT" supabase/functions/master-action/core.ts
          grep -q "10 MB" supabase/functions/master-action/core.ts
          grep -q 'getBB(p\[0\]||{})' supabase/functions/master-action/index.ts
          grep -q 'getSupplier(c,p\[0\]||{})' supabase/functions/master-action/index.ts
          grep -q 'hasMore' supabase/functions/master-action/master-bb.ts
          grep -q 'hasMore' supabase/functions/master-action/supplier.ts
      - name: Deploy
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase functions deploy master-action --project-ref "$SUPABASE_PROJECT_REF" --use-api --debug
      - name: Verify
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
