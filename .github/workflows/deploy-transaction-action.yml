# Deployment trigger: canonical transaction architecture v11+
name: Deploy transaction and approval functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/transaction-action/**'
      - 'supabase/functions/transaction-edit-action/**'
      - 'supabase/functions/approval-payment-action/**'
      - '.github/workflows/deploy-transaction-action.yml'

permissions:
  contents: read

concurrency:
  group: deploy-transaction-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dmjsgtichrfxhyywstrt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate transaction architecture
        shell: bash
        run: |
          set -euo pipefail
          TX='supabase/functions/transaction-action/index.ts'
          EDIT='supabase/functions/transaction-edit-action/index.ts'
          AP='supabase/functions/approval-payment-action'
          test -s "$TX"
          test -s "$EDIT"
          test -s "$AP/index.ts"
          test -s "$AP/read-stage-a.ts"
          test -s "$AP/submit.ts"
          test -s "$AP/verify.ts"
          grep -q 'Deno.serve' "$TX"
          grep -q 'Deno.serve' "$EDIT"
          grep -q 'update_transaction_with_documents_atomic' "$EDIT"
          grep -q 'TRANSAKSI_DOCUMENTS' "$TX"
          grep -q 'TRANSAKSI_DOCUMENTS_AVAILABLE' "$TX"
          grep -q 'metadata-on-demand' "$AP/index.ts"
          grep -q 'accessMode' "$AP/read-stage-a.ts"
          grep -q 'submit_transaction_payment_atomic' "$AP/submit.ts"
          grep -q 'verify_transaction_payment_batch_atomic' "$AP/verify.ts"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy transaction-action
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase functions deploy transaction-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy transaction-edit-action
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy transaction-edit-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy approval-payment-action
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy approval-payment-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify deployed functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
