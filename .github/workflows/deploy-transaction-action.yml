# Manual recovery workflow. Automatic production deployment is handled only by
# .github/workflows/supabase-auto-deploy.yml to avoid concurrent Supabase deploys.
name: Deploy transaction and approval functions (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dmjsgtichrfxhyywstrt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate transaction architecture
        shell: bash
        run: |
          set -euo pipefail
          TX='supabase/functions/transaction-action/index.ts'
          EDIT='supabase/functions/transaction-edit-action/index.ts'
          DELETE_SUPPLIER='supabase/functions/supplier-delete-action/index.ts'
          AP='supabase/functions/approval-payment-action'
          test -s "$TX"
          test -s "$EDIT"
          test -s "$DELETE_SUPPLIER"
          test -s "$AP/index.ts"
          test -s "$AP/read-stage-a.ts"
          test -s "$AP/submit.ts"
          test -s "$AP/verify.ts"
          grep -q 'Deno.serve' "$TX"
          grep -q 'Deno.serve' "$EDIT"
          grep -q 'Deno.serve' "$DELETE_SUPPLIER"
          grep -q 'update_transaction_with_documents_atomic' "$EDIT"
          grep -q "'SUPPLIER ID': null" "$DELETE_SUPPLIER"
          grep -q 'TRANSAKSI_DOCUMENTS' "$TX"
          grep -q 'TRANSAKSI_DOCUMENTS_AVAILABLE' "$TX"
          grep -q 'metadata-on-demand' "$AP/index.ts"
          grep -q 'accessMode' "$AP/read-stage-a.ts"
          grep -q 'submit_transaction_payment_atomic' "$AP/submit.ts"
          grep -q 'verify_transaction_payment_batch_atomic' "$AP/verify.ts"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy transaction-action
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase functions deploy transaction-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy transaction-edit-action
        shell: bash
        run: supabase functions deploy transaction-edit-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy supplier-delete-action
        shell: bash
        run: supabase functions deploy supplier-delete-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy approval-payment-action
        shell: bash
        run: supabase functions deploy approval-payment-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify deployed functions
        shell: bash
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
