name: Cleanup auth registration legacy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-auth-registration-v2.py'
      - '.github/workflows/cleanup-auth-registration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply cleanup
        run: python scripts/cleanup-auth-registration-v2.py

      - name: Validate cleaned frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          ! grep -q "registerUser:1" app.js
          ! grep -q "verifyRegistrationOtp" app.js
          ! grep -q "resendRegistrationOtp" app.js
          ! grep -q 'id="registerForm"' index.html
          ! grep -q 'id="otpForm"' index.html
          ! grep -q 'admin-add-user.js' supplier-dropdown.js
          grep -q "createUserBySuperAdmin" app.js
          grep -q 'id="page-add-user"' index.html

      - name: Commit cleaned sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js index.html supplier-dropdown.js; then
            echo 'No source cleanup required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html supplier-dropdown.js
          git commit -m 'Clean legacy public registration code'
          git pull --rebase origin main
          git push origin main
