name: Repair Supabase Migration History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-migration-history-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dmjsgtichrfxhyywstrt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is missing" >&2; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "SUPABASE_DB_PASSWORD is missing" >&2; exit 1; }

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Back up migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee migration-history-before.txt

      - uses: actions/upload-artifact@v4
        with:
          name: migration-history-before-repair
          path: migration-history-before.txt
          retention-days: 30

      - name: Rebuild canonical migration baseline
        shell: bash
        run: |
          set -euo pipefail

          remote_versions=(
            20260701172008
            20260710094345
            20260710103510
            20260710104455
            20260710104519
            20260710104807
            20260710193813
            20260710203416
            20260711025956
            20260714105457
            20260715033248
            20260715033800
            20260715064248
            20260715065310
            20260715065727
            20260715065742
            20260715070025
            20260715070035
            20260715070323
            20260715070505
            20260717145707
            20260717150125
            20260717172516
            20260717172720
            20260717173018
            20260718054326
            20260718055428
            20260718064516
            20260718070841
            20260718081738
            20260718082719
            20260718101321
            20260718101338
            20260718102650
            20260718110202
            20260719163807
            20260719174410
            20260719174654
            20260720152733
            20260720153103
            20260720153124
            20260720153716
            20260720153758
            20260720153810
            20260720153857
            20260720153908
            20260720153927
            20260720154028
            20260720163158
            20260720163629
            20260720165126
            20260720170145
            20260720170459
            20260724023613
            20260724030219
            20260724040423
            20260727071627
            20260729123120
          )

          supabase migration repair "${remote_versions[@]}" --status reverted --password "$SUPABASE_DB_PASSWORD"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete
          supabase db pull production_baseline --password "$SUPABASE_DB_PASSWORD" --yes

          echo "Canonical history after repair:"
          supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Commit canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git diff --cached --check
          git commit -m "fix(supabase): reconcile production migration history"
          git push origin HEAD:main
