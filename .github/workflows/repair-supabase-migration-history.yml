          supabase migration repair "${remote_versions[@]}" --status reverted --password "$SUPABASE_DB_PASSWORD"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete
          supabase db pull production_baseline --password "$SUPABASE_DB_PASSWORD" --yes

          echo "Canonical history after repair:"
          supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Commit canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git diff --cached --check
          git commit -m "fix(supabase): reconcile production migration history"
          git push origin HEAD:main
