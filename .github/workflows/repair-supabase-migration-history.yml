name: Repair Supabase Migration History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-supabase-migration-history.yml

permissions:
  contents: write

concurrency:
  group: supabase-migration-history-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dmjsgtichrfxhyywstrt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is missing" >&2; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "SUPABASE_DB_PASSWORD is missing" >&2; exit 1; }

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Back up migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee migration-history-before.txt

      - uses: actions/upload-artifact@v4
        with:
          name: migration-history-before-repair
          path: migration-history-before.txt
          retention-days: 30

      - name: Rebuild canonical migration baseline
        shell: bash
        run: |
          set -euo pipefail

          remote_versions=(
