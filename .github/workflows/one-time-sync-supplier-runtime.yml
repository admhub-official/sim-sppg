name: One-time supplier runtime sync

on:
  push:
    branches: [fix/supplier-ui-consolidation]
    paths: [.github/workflows/one-time-sync-supplier-runtime.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-ui-consolidation
          fetch-depth: 0
      - name: Synchronize cache versions and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script src="\./app\.js\?v=([^"]+)"></script>', index)
          if not match:
              raise SystemExit('Versi app pada index tidak ditemukan')
          version = match.group(1)
          worker_path = Path('_worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker, count = re.subn(r"const version = '[^']+';", f"const version = '{version}';", worker, count=1)
          if count != 1:
              raise SystemExit('Versi worker tidak dapat disinkronkan')
          worker_path.write_text(worker, encoding='utf-8')
          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, count = re.subn(r"const CACHE_VERSION = '[^']+';", f"const CACHE_VERSION = 'sim-sppg-v{version}';", sw, count=1)
          if count != 1:
              raise SystemExit('Versi service worker tidak dapat disinkronkan')
          sw_path.write_text(sw, encoding='utf-8')
          Path('.github/workflows/one-time-sync-supplier-runtime.yml').unlink()
          PY
          node --check _worker.js
          node --check sw.js
          node --check supplier-inline-create.js
          node --check transaction-category-supplier-rules.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: synchronize supplier runtime cache"
          git push origin HEAD:fix/supplier-ui-consolidation
