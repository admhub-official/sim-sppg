name: Bust SIM-SPPG auth recovery cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache_bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump service worker cache version
        shell: python
        run: |
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE_VERSION = 'sim-sppg-v20260811-mytrx-v2';", "const CACHE_VERSION = 'sim-sppg-v20260819-auth-recovery-v1';", 1)
          if "sim-sppg-v20260819-auth-recovery-v1" not in s:
              raise SystemExit('Service worker cache version was not updated.')
          p.write_text(s, encoding='utf-8')
      - name: Commit cache bust and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/auth-recovery-cache-bust.yml
          git add sw.js
          git commit -m "fix: bust stale service worker cache after auth cleanup"
          git push origin HEAD:main
