name: One-time Custom Supplier Dropdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-custom-supplier-dropdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach in-app supplier dropdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script src="./app.js?v=20260729-optimize-supabase-egress-hotfix-v1"></script>'
          script = '<script src="./supplier-dropdown.js?v=20260730-in-app-v1"></script>'
          if script not in html:
              if marker not in html:
                  raise SystemExit('app.js marker tidak ditemukan')
              html = html.replace(marker, marker + '\n' + script, 1)
          index.write_text(html, encoding='utf-8')
          PY
          git rm .github/workflows/one-time-custom-supplier-dropdown.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supplier-dropdown.js
          git commit -m 'fix: use in-app supplier dropdown' || exit 0
          git push
