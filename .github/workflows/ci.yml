name: SIM-SPPG CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate maintained JavaScript modules
        shell: bash
        run: |
          set -euo pipefail

          maintained_files=(
            supplier-dropdown.js
            assets/js/users/role-management.js
            assets/js/transactions/edit-supplier-options-fix.js
            assets/js/transactions/filter-and-edit-supplier.js
            assets/js/transactions/edit-save-reliability.js
            assets/js/transactions/supplier-label-update.js
            assets/js/supplier/app-dropdowns.js
            assets/js/supplier/edit-transaction-ui.js
            assets/js/supplier/storage-egress-optimizer.js
            assets/js/supplier/supplier-actions-fix.js
            assets/js/reports/approval-export-columns.js
            assets/js/reports/approval-supplier-summary.js
            assets/js/reports/approval-print-all-pages.js
            assets/js/reports/transaction-export-category.js
            transaction-category-supplier-rules.js
            assets/js/documents.js
            _worker.js
            sw.js
          )

          for file in "${maintained_files[@]}" scripts/*.mjs; do
            test -f "$file"
            node --check "$file"
          done

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node -e "for (const f of ['package.json','manifest.json']) { if (require('fs').existsSync(f)) JSON.parse(require('fs').readFileSync(f, 'utf8')); }"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate source structure
        run: npm run check:structure

      - name: Run consolidated hardening audit
        run: node scripts/final-hardening-audit.mjs

      - name: Run egress regression check
        run: npm run check:egress

      - name: Audit buttons, handlers, and modals
        run: npm run check:ui-actions

      - name: Prevent committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$|credentials\.json$|service-account\.json$|secrets\.json$)'; then
            echo 'Potential secret file is tracked by Git.' >&2
            exit 1
          fi
