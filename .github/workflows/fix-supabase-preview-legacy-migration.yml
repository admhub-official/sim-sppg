name: Fix Supabase Preview Legacy Migration

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-supabase-preview-legacy-migration.mjs
      - .github/workflows/fix-supabase-preview-legacy-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-supabase-preview-legacy-migration
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch historical migration for fresh previews
        run: node scripts/fix-supabase-preview-legacy-migration.mjs

      - name: Validate SQL diff
        run: git diff --check

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260724030219_normalize_transaction_document_paths_and_remove_legacy_links.sql
          git commit -m 'fix(supabase): skip removed legacy columns in fresh previews'
          git push origin main
