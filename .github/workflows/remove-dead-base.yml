name: Remove dead base tag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-dead-base.py'
      - '.github/workflows/remove-dead-base.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove-dead-base.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o '<base ' index.html | wc -l)" -eq 1
          grep -Fq '<base target="_top">' index.html
          ! grep -Fq '<base target="_blank">' index.html
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove ineffective duplicate base tag'
          git pull --rebase origin main
          git push origin main

# One-time cleanup; remove after success.
