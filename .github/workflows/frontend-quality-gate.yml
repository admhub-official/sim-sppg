name: Frontend quality gate

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'sw.js'
      - '_worker.js'
      - 'index.html'
      - 'assets/css/**'
      - 'assets/js/turnstile-login.js'
      - '.github/workflows/frontend-quality-gate.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'sw.js'
      - '_worker.js'
      - 'index.html'
      - 'assets/css/**'
      - 'assets/js/turnstile-login.js'
      - '.github/workflows/frontend-quality-gate.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check _worker.js
          node --check assets/js/turnstile-login.js
      - name: Reject unresolved merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- app.js sw.js _worker.js index.html assets/css assets/js/turnstile-login.js; then exit 1; fi
      - name: Validate canonical runtime
        run: |
          grep -Fq "var API_BASE_URL" app.js
          grep -Fq "var API_ROUTES" app.js
          grep -Fq "Fungsi API tidak terdaftar" app.js
          grep -Fq "function loadApprovalData(page)" app.js
          grep -Fq "if (approvalLoadState.inFlight) {" app.js
          grep -Fq "var filters = approvalRequestFilters(page, false);" app.js
          grep -Fq "approvalOnly: true" app.js
          grep -Fq "var normalizedResponse = normalizeApprovalApiResponse(result);" app.js
          grep -Fq "Approval render failure:" app.js
          worker_version="$(sed -n "s/.*const version = '\([^']*\)'.*/\1/p" _worker.js | head -n 1)"
          sw_version="$(sed -n "s/.*const CACHE_VERSION = 'sim-sppg-v\([^']*\)'.*/\1/p" sw.js | head -n 1)"
          if [ -z "$worker_version" ] || [ -z "$sw_version" ]; then
            echo "::error::Versi cache frontend tidak ditemukan di _worker.js atau sw.js."
            exit 1
          fi
          if [ "$worker_version" != "$sw_version" ]; then
            echo "::error::Versi cache frontend tidak sinkron: worker=$worker_version, sw=$sw_version"
            exit 1
          fi
          grep -Fq "pageKey()==='approval'" app.js
          if grep -Fq 'class="auth-card-brand"' index.html; then exit 1; fi
          grep -Fq "margin-top: -14px;" index.html
          test -f assets/css/auth-modern.css
          test -f assets/css/mobile-modern.css
          test -f assets/css/interaction-modern.css
          test ! -e assets/js/registration-flow.js
          test ! -e .github/auth-redesign-trigger.txt
          if grep -Fq 'registration-flow.js' _worker.js; then
            echo "::error::Dead registration-flow runtime masih diinjeksi oleh worker."
            exit 1
          fi
          grep -Fq '/assets/css/auth-modern.css' _worker.js
          grep -Fq '/assets/css/mobile-modern.css' _worker.js
          grep -Fq '/assets/css/interaction-modern.css' _worker.js
          grep -Fq './assets/css/auth-modern.css' sw.js
          grep -Fq './assets/css/mobile-modern.css' sw.js
          grep -Fq './assets/css/interaction-modern.css' sw.js
          grep -Fq '.modal-box::before' assets/css/interaction-modern.css
          grep -Fq '.modal-footer .btn' assets/css/interaction-modern.css
          test "$(grep -Fc 'function loadApprovalData(page)' app.js)" -eq 1
          if grep -Fq 'function runQueuedApprovalReload()' app.js; then exit 1; fi
          if grep -Fq 'approvalRuntime' _worker.js; then exit 1; fi
          if grep -Fq '<script src="./approval-transaction-loader.js' _worker.js; then exit 1; fi
          if grep -Fq 'networkFirstAppWithCompatibility' sw.js; then exit 1; fi
      - name: Validate pagination integrations
        run: |
          for token in txServerPaged approvalServerPaged usersServerPaged bbServerPaged supplierServerPaged surveiServerPaged stServerPaged menuServerPaged pendingServerPaged auditServerPaged notifServerPaged; do
            grep -Fq "$token" app.js || exit 1
          done
      - name: Check accidental credential literals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          files=[Path('app.js'),Path('sw.js'),Path('_worker.js'),Path('index.html'),Path('assets/js/turnstile-login.js')]
          p=re.compile(r"(?:service_role|SUPABASE_SERVICE_ROLE_KEY)\s*[:=]\s*['\"]([A-Za-z0-9._-]{20,})['\"]",re.I)
          findings=[]
          for f in files:
              t=f.read_text(encoding='utf-8',errors='replace')
              findings += [f'{f}:{t.count(chr(10),0,m.start())+1}' for m in p.finditer(t)]
          if findings:
              print('\n'.join(findings),file=sys.stderr); sys.exit(1)
          PY
      - name: Summary
        run: echo 'Frontend canonical runtime, mobile surfaces, interaction styles, and cleanup checks passed.'
