name: Consolidate API router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-api-router.py'
      - '.github/workflows/consolidate-api-router.yml'

permissions:
  contents: write

concurrency:
  group: consolidate-api-router
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate routing
        run: python scripts/consolidate-api-router.py
      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check supplier-dropdown.js
          grep -Fq "'transaction-create-action': { addTransaction:1 }" app.js
          grep -Fq "'transaction-edit-action': { editTransaction:1 }" app.js
          grep -Fq "'transaction-file-upload-action': { uploadTxFile:1 }" app.js
          grep -Fq "'transaction-summary-action': { getTransactionSummary:1 }" app.js
          grep -Fq "'supplier-delete-action': { deleteSupplier:1 }" app.js
          grep -Fq "return 'approval-query-action';" app.js
          ! grep -Fq 'stage-d-api-router.js' supplier-dropdown.js
          ! grep -Fq 'add-save-reliability.js' supplier-dropdown.js
          test ! -e assets/js/supplier/stage-d-api-router.js
          test ! -e assets/js/transactions/add-save-reliability.js
          git diff --check
      - name: Commit consolidated router
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app.js supplier-dropdown.js .github/workflows/ci.yml assets/js/supplier/stage-d-api-router.js assets/js/transactions/add-save-reliability.js
          if git diff --cached --quiet; then
            echo 'Router already consolidated.'
            exit 0
          fi
          git commit -m 'Consolidate hardened API routing in app router'
          git pull --rebase origin main
          git push origin main

# One-time execution; delete this workflow after a successful run.
