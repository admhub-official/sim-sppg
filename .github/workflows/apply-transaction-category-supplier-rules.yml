name: Apply transaction category supplier rules

on:
  push:
    branches: [main]
    paths:
      - transaction-category-supplier-rules.js
      - scripts/apply-transaction-category-supplier-rules.mjs
      - .github/workflows/apply-transaction-category-supplier-rules.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply deterministic patch
        run: node scripts/apply-transaction-category-supplier-rules.mjs

      - name: Validate JavaScript
        run: |
          node --check transaction-category-supplier-rules.js
          node --check _worker.js
          node --check scripts/apply-transaction-category-supplier-rules.mjs

      - name: Commit patched runtime and Edge Function
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js supabase/functions/transaction-action/index.ts
          git commit -m "feat: enforce transaction category and supplier rules"
          git push origin HEAD:main
